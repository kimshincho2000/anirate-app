name: Build Anirate Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/Anirate-v1.3.2.apk
          if [ -f ~/.android/debug.keystore ]; then
            cp ~/.android/debug.keystore output/debug.keystore
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anirate-v1.3.2-APK
          path: output/Anirate-v1.3.2.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.2
          name: "Anirate Android App v1.3.2 (Fix URI download & UI adjustments)"
          body: "Official Anirate Android Application v1.3.2 with fixed relative URI downloader, floating button margin fix, and instant admin mode."
          files: output/Anirate-v1.3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
